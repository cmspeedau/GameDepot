<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} - GameDepot</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  {{template "nav" .}}
  <main class="mx-auto max-w-3xl px-6 py-8">
    <h1 class="text-xl font-semibold mb-4">Objects</h1>
    {{template "flash" .}}
    <form method="post" action="/dashboard/objects" enctype="multipart/form-data" class="flex gap-2 mb-6">
      <input type="hidden" name="_csrf" value="{{.CSRF}}">
      <input type="file" name="file" class="text-sm">
      <button class="rounded bg-blue-600 px-4 py-2 text-sm font-medium">Upload</button>
    </form>
    <p class="text-zinc-400 text-sm">Uploaded objects are content-addressed by SHA-256 and deduplicated.</p>
  </main>
</body>
</html>
