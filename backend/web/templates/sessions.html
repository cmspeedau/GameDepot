<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} - GameDepot</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  {{template "nav" .}}
  <main class="mx-auto max-w-3xl px-6 py-8">
    <h1 class="text-xl font-semibold mb-4">Sessions</h1>
    {{template "flash" .}}
    <table class="w-full text-sm">
      <thead><tr class="text-left text-zinc-400"><th class="py-2">Created</th><th>Expires</th><th></th></tr></thead>
      <tbody>
      {{range .Sessions}}
        <tr class="border-t border-zinc-800">
          <td class="py-2">{{.CreatedAt.Time.Format "2006-01-02 15:04"}}</td>
          <td>{{.ExpiresAt.Time.Format "2006-01-02 15:04"}}</td>
          <td>
            {{if ne (uuid .ID) ($.CurrentID.String)}} 
            <form method="post" action="/dashboard/sessions/{{uuid .ID}}/revoke" class="inline">
              <input type="hidden" name="_csrf" value="{{$.CSRF}}">
              <button class="text-red-400 hover:underline">revoke</button>
            </form>
            {{else}}current{{end}}
          </td>
        </tr>
      {{end}}
      </tbody>
    </table>
  </main>
</body>
</html>
