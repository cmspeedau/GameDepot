{{define "nav"}}
<nav class="border-b border-zinc-800/60 bg-zinc-950/80 backdrop-blur px-6 py-4 flex items-center justify-between sticky top-0 z-40">
  <a href="/dashboard" class="font-semibold tracking-tight hover:text-blue-400 transition-colors">GameDepot</a>
  <div class="flex items-center gap-4 text-sm text-zinc-400">
    {{if .Username}}<span class="text-zinc-300">{{.Username}}</span>{{end}}
    <form method="post" action="/signout"><button class="hover:text-zinc-100 transition-colors">Sign out</button></form>
  </div>
</nav>
{{end}}

{{define "flash"}}
{{if .Flash}}<div class="mb-4 rounded-lg border border-blue-500/30 bg-blue-500/10 px-4 py-3 text-sm text-blue-200 shadow-sm">{{.Flash}}</div>{{end}}
{{if .Error}}<div class="mb-4 rounded-lg border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-200 shadow-sm">{{.Error}}</div>{{end}}
{{end}}
