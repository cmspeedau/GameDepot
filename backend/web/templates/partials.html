{{define "nav"}}
<nav class="border-b border-zinc-800 px-6 py-4 flex items-center justify-between">
  <a href="/dashboard" class="font-semibold">GameDepot</a>
  <div class="flex items-center gap-4 text-sm text-zinc-400">
    {{if .Username}}<span>{{.Username}}</span>{{end}}
    <form method="post" action="/signout"><button class="hover:text-zinc-100">Sign out</button></form>
  </div>
</nav>
{{end}}

{{define "flash"}}
{{if .Flash}}<div class="mb-4 rounded border border-blue-700 bg-blue-900/40 px-4 py-2 text-sm">{{.Flash}}</div>{{end}}
{{if .Error}}<div class="mb-4 rounded border border-red-700 bg-red-900/40 px-4 py-2 text-sm text-red-200">{{.Error}}</div>{{end}}
{{end}}
