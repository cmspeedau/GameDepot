<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} - GameDepot</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  {{template "nav" .}}
  <main class="mx-auto max-w-md px-6 py-16">
    <h1 class="text-2xl font-semibold mb-6">Sign up</h1>
    {{template "flash" .}}
    <form method="post" action="/signup" class="space-y-4">
      <input type="hidden" name="_csrf" value="{{.CSRF}}">
      <label class="block">
        <span class="text-sm">Invitation code</span>
        <input name="code" value="{{.Code}}" class="mt-1 w-full rounded border border-zinc-700 bg-zinc-900 px-3 py-2 font-mono" required>
      </label>
      <label class="block">
        <span class="text-sm">Username</span>
        <input name="username" class="mt-1 w-full rounded border border-zinc-700 bg-zinc-900 px-3 py-2" required>
      </label>
      <label class="block">
        <span class="text-sm">Password</span>
        <input type="password" name="password" class="mt-1 w-full rounded border border-zinc-700 bg-zinc-900 px-3 py-2" required minlength="8">
      </label>
      <button class="rounded bg-lime-600 px-4 py-2 font-medium">Create account</button>
    </form>
  </main>
</body>
</html>
