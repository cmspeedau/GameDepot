[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
aes-gcm = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
thiserror = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
dirs = "7.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "json"] }
async-trait = "0.1"
keyring = "4"
tar = "0.4"
zstd = "0.13"
